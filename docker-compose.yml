version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foxcord
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env.example
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      - ./uploads:/app/uploads
    ports:
      - "4000:4000"
    depends_on:
      - db

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    env_file:
      - .env.example
    volumes:
      - ./client:/app/client
      - ./shared:/app/shared
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  postgres_data:
